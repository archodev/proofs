<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">A six-record extension example</title>
  <desc id="desc">Vertices 1 through 5 form a cycle. Vertex 6 is adjacent to 1 and 3, and is not adjacent to 2 or 4. Solid lines represent edges; dashed lines mark those two nonedges. The picture is a schematic of six records, not a six-vertex k-extension graph.</desc>
  <rect width="960" height="370" rx="18" fill="#f4f7fb"/>
  <text x="30" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#172b49">A witness for one extension request</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 82 L380 155 L330 302 L170 302 L120 155 Z" stroke="#354d69" stroke-width="4"/>
    <path d="M250 192 L250 82 M250 192 L330 302" stroke="#176a8a" stroke-width="5"/>
    <path d="M250 192 L380 155 M250 192 L170 302" stroke="#a3472e" stroke-width="3" stroke-dasharray="7 7"/>
  </g>
  <g font-family="sans-serif" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <g fill="#ffffff" stroke="#354d69" stroke-width="3"><circle cx="250" cy="82" r="19"/><circle cx="380" cy="155" r="19"/><circle cx="330" cy="302" r="19"/><circle cx="170" cy="302" r="19"/><circle cx="120" cy="155" r="19"/></g>
    <circle cx="250" cy="192" r="21" fill="#176a8a" stroke="#0c4c66" stroke-width="3"/>
    <g fill="#172b49"><text x="250" y="82">1</text><text x="380" y="155">2</text><text x="330" y="302">3</text><text x="170" y="302">4</text><text x="120" y="155">5</text></g>
    <text x="250" y="192" fill="#ffffff">6</text>
  </g>
  <g font-family="sans-serif" fill="#172b49">
    <text x="492" y="113" font-size="19" font-weight="700">Request</text>
    <text x="492" y="143" font-size="17">A = {1, 3}  ·  B = {2, 4}</text>
    <text x="492" y="185" font-size="16">6 is adjacent to every vertex in A</text>
    <text x="492" y="211" font-size="16">and avoids every vertex in B.</text>
    <path d="M492 245 h45" stroke="#176a8a" stroke-width="5"/>
    <text x="550" y="250" font-size="15">witness edge</text>
    <path d="M492 277 h45" stroke="#a3472e" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="550" y="282" font-size="15">required nonedge</text>
  </g>
</svg>
