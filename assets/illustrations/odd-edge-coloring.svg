<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="title desc"><title id="title">The rule at one vertex</title><desc id="desc">Illustrative local configurations. Three, one and one are all odd, while two, two and one is disallowed.</desc><rect width="820" height="310" rx="22" fill="#f3f7fc"/><g font-family="system-ui,sans-serif"><text x="30" y="39" fill="#112a43" font-size="25" font-weight="700" text-anchor="start">The rule at one vertex</text><rect x="47" y="64" width="344" height="218" rx="15" fill="#fff"/><text x="219" y="98" fill="#112a43" font-size="20" font-weight="700" text-anchor="middle">Allowed</text><line x1="219" y1="168" x2="170.49611766894716" y2="152.24013328687766" stroke="#2165d4" stroke-width="6" stroke-linecap="round"/><circle cx="170.49611766894716" cy="152.24013328687766" r="7" fill="#2165d4" stroke="#fff" stroke-width="2"/><line x1="219" y1="168" x2="219.0" y2="117.0" stroke="#2165d4" stroke-width="6" stroke-linecap="round"/><circle cx="219.0" cy="117.0" r="7" fill="#2165d4" stroke="#fff" stroke-width="2"/><line x1="219" y1="168" x2="267.5038823310528" y2="152.2401332868777" stroke="#2165d4" stroke-width="6" stroke-linecap="round"/><circle cx="267.5038823310528" cy="152.2401332868777" r="7" fill="#2165d4" stroke="#fff" stroke-width="2"/><line x1="219" y1="168" x2="248.97704786691614" y2="209.25986671312234" stroke="#007d75" stroke-width="6" stroke-linecap="round"/><circle cx="248.97704786691614" cy="209.25986671312234" r="7" fill="#007d75" stroke="#fff" stroke-width="2"/><line x1="219" y1="168" x2="189.0229521330839" y2="209.25986671312234" stroke="#b65329" stroke-width="6" stroke-linecap="round"/><circle cx="189.0229521330839" cy="209.25986671312234" r="7" fill="#b65329" stroke="#fff" stroke-width="2"/><circle cx="219" cy="168" r="9" fill="#112a43" stroke="#fff" stroke-width="2"/><text x="219" y="252" fill="#4d6073" font-size="16" font-weight="600" text-anchor="middle">3 blue  /  1 teal  /  1 orange</text