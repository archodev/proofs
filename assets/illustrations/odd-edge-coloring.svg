<svg xmlns="http://www.w3.org/2000/svg" width="840" height="323" viewBox="0 0 840 323" role="img" aria-labelledby="t d">
<title id="t">At each point: zero or odd per color</title>
<desc id="d">These are local illustrations, not whole graphs satisfying the theorem’s conditions. Zero is allowed. At most three colors suffice globally for the finite simple 3-connected graphs of odd order and minimum degree at least four specified in the theorem.</desc>
<rect x="0" y="0" width="840" height="323" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#192931" font-weight="700" text-anchor="start">At each point: zero or an odd number of each color</text><rect x="24" y="64" width="386" height="190" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="46" y="97" font-size="16" fill="#176d68" font-weight="700" text-anchor="start">WORKS</text><line x1="132" y1="161" x2="132" y2="113" stroke="#245ca5" stroke-width="5" stroke-linecap="round"/><circle cx="132" cy="113" r="5" fill="#245ca5" stroke="none" stroke-width="1"/><line x1="132" y1="161" x2="177.65071" y2="146.16718" stroke="#245ca5" stroke-width="5" stroke-linecap="round"/><circle cx="177.65071" cy="146.16718" r="5" fill="#245ca5" stroke="none" stroke-width="1"/><line x1="132" y1="161" x2="160.21369" y2="199.83282" stroke="#245ca5" stroke-width="5" stroke-linecap="round"/><circle cx="160.21369" cy="199.83282" r="5" fill="#245ca5" stroke="none" stroke-width="1"/><line x1="132" y1="161" x2="103.78631" y2="199.83282" stroke="#176d68" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="103.78631" cy="199.83282" r="5" fill="#176d68" stroke="none" stroke-width="1"/><line x1="132" y1="161" x2="86.34929" y2="146.16718" stroke="#a54629" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 4"/><circle cx="86.34929" cy="146.16718" r="5" fill="#a54629" stroke="none" stroke-width="1"/><circle cx="132" cy="161" r="7" fill="#192931" stroke="#fffdfa" stroke-width="1.5"/><text x="195" y="157" font-size="17" fill="#192931" font-weight="700" text-anchor="start">3 blue · 1 teal · 1 rust</text><text x="195" y="185" font-size="15" fill="#52636a" font-weight="500" text-anchor="start">All odd.</text><rect x="430" y="64" width="386" height="190" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="452" y="97" font-size="16" fill="#a54629" font-weight="700" text-anchor="start">DOES NOT WORK</text><line x1="538" y1="161" x2="538" y2="113" stroke="#245ca5" stroke-width="5" stroke-linecap="round"/><circle cx="538" cy="113" r="5" fill="#245ca5" stroke="none" stroke-width="1"/><line x1="538" y1="161" x2="583.65071" y2="146.16718" stroke="#245ca5" stroke-width="5" stroke-linecap="round"/><circle cx="583.65071" cy="146.16718" r="5" fill="#245ca5" stroke="none" stroke-width="1"/><line x1="538" y1="161" x2="566.21369" y2="199.83282" stroke="#176d68" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="566.21369" cy="199.83282" r="5" fill="#176d68" stroke="none" stroke-width="1"/><line x1="538" y1="161" x2="509.78631" y2="199.83282" stroke="#176d68" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 4"/><circle cx="509.78631" cy="199.83282" r="5" fill="#176d68" stroke="none" stroke-width="1"/><line x1="538" y1="161" x2="492.34929" y2="146.16718" stroke="#a54629" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 4"/><circle cx="492.34929" cy="146.16718" r="5" fill="#a54629" stroke="none" stroke-width="1"/><circle cx="538" cy="161" r="7" fill="#192931" stroke="#fffdfa" stroke-width="1.5"/><text x="601" y="157" font-size="17" fill="#192931" font-weight="700" text-anchor="start">2 blue · 2 teal · 1 rust</text><text x="601" y="185" font-size="15" fill="#52636a" font-weight="500" text-anchor="start">Two is even.</text><rect x="24" y="267" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="294" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">For the graphs in the theorem, three colors suffice.</text></g>
</svg>
