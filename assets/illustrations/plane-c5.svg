<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="title desc"><title id="title">A five-step unit loop</title><desc id="desc">Five vertices in the two-circle construction, connected in cyclic order by unit-length segments.</desc><rect width="820" height="310" rx="22" fill="#f3f7fc"/><g font-family="system-ui,sans-serif"><text x="30" y="39" fill="#112a43" font-size="25" font-weight="700" text-anchor="start">A five-step unit loop</text><circle cx="243" cy="181" r="104" fill="none" stroke="#aac3d9" stroke-width="2"/><circle cx="243" cy="181" r="60.044" fill="none" stroke="#aac3d9" stroke-width="2" stroke-dasharray="4 5"/><line x1="243" y1="181" x2="347" y2="181" stroke="#2165d4" stroke-width="5" stroke-linecap="round"/><line x1="347" y1="181" x2="260.3333333333333" y2="123.51183696717308" stroke="#2165d4" stroke-width="5" stroke-linecap="round"/><line x1="260.3333333333333" y1="123.51183696717308" x2="184.54712373000376" y2="194.7329745174832" stroke="#2165d4" stroke-width="5" stroke-linecap="round"/><line x1="184.54712373000376" y1="194.7329745174832" x2="191.0" y2="90.93335800641839" stroke="#2165d4" stroke-width="5" stroke-linecap="round"/><line x1="191.0" y1="90.93335800641839" x2="243" y2="181" stroke="#2165d4" stroke-width="5" stroke-linecap="round"/><circle cx="243" cy="181" r="8" fill="#2165d4" stroke="#fff" stroke-width="2"/><circle cx="347" cy="181" r="8" fill="#2165d4" stroke="#fff" stroke-width="2"/><circle cx="260.3333333333333" cy="123.51183696717308" r="8" fill="#2165d4" stroke="#fff" stroke-width="2"/><circle cx="184.54712373000376" cy="194.7329745174832" r="8" fill="#2165d4" stroke="#fff" stroke-width="2"/><circle cx="191.0" cy="90.93335800641839" r="8" fill="#2165d4" stroke="#fff" stroke-width="2"/><text x="415" y="110" fill="#112a43" font-size="23" font-weight="650" text-anchor="start">All five blue steps have length 1.</text><text x="415" y="151" fill="#4d6073" font-size="18" font-weight="500" text-anchor="start">The loop is not a regular pentagon.</text><text x="415" y="180" fill="#4d6073" font-size="18" font-weight="500" text-anchor="start">The two guide circles come from</text><text x="415" y="207" fill="#4d6073" font-size="18" font-weight="500" text-anchor="start">the proof’s geometric construction.</text><text x="415" y="267" fill="#2165d4" font-size="15" font-weight="600" text-anchor="start">An example loop, not a coloring of the plane.</text></g></svg>
