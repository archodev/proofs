<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d">
  <title id="t">Two colors. A five-step loop is unavoidable.</title>
  <desc id="d">Left: an example loop of five blue dots joined by five straight steps, each exactly 1 unit long, with a ruler showing 1 unit. The loop is not a regular pentagon and its path crosses itself once; the crossing is not a dot. Right: two sample ways to paint a flat surface with blue and rust, with a note that any painting is allowed. A result box says every painting contains a loop following the same rule, with five same-color dots joined by 1-unit steps. Where it sits and which color it has depend on the painting.</desc>

  <defs>
    <pattern id="rustHatch" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#efc6b2"/>
      <path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#b5532a" stroke-width="2.5"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1000" height="580" fill="#faf7ef"/>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f1d1a">Two colors. A five-step loop is unavoidable.</text>

  <!-- Panel frames -->
  <rect x="30" y="80" width="430" height="470" rx="16" fill="none" stroke="#1f1d1a" stroke-opacity="0.25" stroke-width="2.5"/>
  <rect x="480" y="80" width="490" height="470" rx="16" fill="none" stroke="#1f1d1a" stroke-opacity="0.25" stroke-width="2.5"/>

  <!-- ===== LEFT: the example loop (exact coordinates, no transforms) ===== -->
  <g stroke="#2f5f8f" stroke-width="5" stroke-linecap="round">
    <line x1="220" y1="189" x2="324" y2="189"/>
    <line x1="324" y1="189" x2="237.3333333" y2="131.5118370"/>
    <line x1="237.3333333" y1="131.5118370" x2="161.5471237" y2="202.7329745"/>
    <line x1="161.5471237" y1="202.7329745" x2="168" y2="98.9333580"/>
    <line x1="168" y1="98.9333580" x2="220" y2="189"/>
  </g>
  <g fill="#2f5f8f" stroke="#1f1d1a" stroke-width="2.5">
    <circle cx="220" cy="189" r="8"/>
    <circle cx="324" cy="189" r="8"/>
    <circle cx="237.3333333" cy="131.5118370" r="8"/>
    <circle cx="161.5471237" cy="202.7329745" r="8"/>
    <circle cx="168" cy="98.9333580" r="8"/>
  </g>

  <!-- Step-length labels (each step = 1) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f1d1a" text-anchor="middle" stroke="#faf7ef" stroke-width="5" paint-order="stroke">
    <text x="272" y="218">1</text>
    <text x="294" y="156">1</text>
    <text x="234" y="166">1</text>
    <text x="146" y="162">1</text>
    <text x="198" y="125">1</text>
  </g>

  <!-- Ruler: exactly 104 units = 1 -->
  <g stroke="#1f7a7a" stroke-width="4" stroke-linecap="round">
    <line x1="168" y1="250" x2="272" y2="250"/>
    <line x1="168" y1="241" x2="168" y2="259"/>
    <line x1="272" y1="241" x2="272" y2="259"/>
  </g>
  <text x="284" y="257" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f7a7a">= 1 unit</text>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1f1d1a">
    <text x="52" y="300" font-size="22" font-weight="700">The loop: 5 dots, one color</text>
    <text x="52" y="332" font-size="20">Each step is exactly 1 unit long.</text>
    <text x="52" y="362" font-size="20">Only the lengths matter — it is</text>
    <text x="52" y="388" font-size="20">not a regular pentagon. The path</text>
    <text x="52" y="414" font-size="20">even crosses itself; that crossing</text>
    <text x="52" y="440" font-size="20">is not one of the dots.</text>
  </g>

  <!-- Legend -->
  <circle cx="64" cy="490" r="10" fill="#2f5f8f" stroke="#1f1d1a" stroke-width="2.5"/>
  <text x="84" y="497" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f1d1a">blue</text>
  <rect x="150" y="480" width="20" height="20" fill="url(#rustHatch)" stroke="#1f1d1a" stroke-width="2.5"/>
  <text x="180" y="497" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1f1d1a">rust (striped)</text>
  <text x="52" y="530" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1f1d1a">Shown in blue; it could just as well be rust.</text>

  <!-- ===== RIGHT: any two-color painting ===== -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f1d1a">
    <text x="502" y="114" font-size="22" font-weight="700">Paint every point blue or rust</text>
    <text x="502" y="142" font-size="20">Any pattern you like, for example:</text>
  </g>

  <!-- Painting 1: stripes -->
  <rect x="502" y="158" width="42" height="140" fill="#bcd2e8"/>
  <rect x="544" y="158" width="42" height="140" fill="url(#rustHatch)"/>
  <rect x="586" y="158" width="42" height="140" fill="#bcd2e8"/>
  <rect x="628" y="158" width="42" height="140" fill="url(#rustHatch)"/>
  <rect x="670" y="158" width="42" height="140" fill="#bcd2e8"/>
  <rect x="502" y="158" width="210" height="140" fill="none" stroke="#1f1d1a" stroke-width="2.5"/>

  <!-- Painting 2: patches -->
  <rect x="740" y="158" width="210" height="140" fill="#bcd2e8"/>
  <path d="M760,172 C800,162 830,187 820,217 C810,247 765,242 755,212 C750,197 750,180 760,172 Z" fill="url(#rustHatch)" stroke="#b5532a" stroke-width="2"/>
  <path d="M862,202 C902,187 940,207 935,242 C930,277 882,287 862,262 C847,242 847,214 862,202 Z" fill="url(#rustHatch)" stroke="#b5532a" stroke-width="2"/>
  <path d="M800,257 C820,252 835,267 828,283 C820,293 795,291 792,277 C790,267 792,260 800,257 Z" fill="url(#rustHatch)" stroke="#b5532a" stroke-width="2"/>
  <rect x="740" y="158" width="210" height="140" fill="none" stroke="#1f1d1a" stroke-width="2.5"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1f1d1a" text-anchor="middle">
    <text x="607" y="326" font-size="20">Painting 1</text>
    <text x="845" y="326" font-size="20">Painting 2</text>
    <text x="726" y="358" font-size="20" font-style="italic">… or any other painting at all</text>
  </g>

  <!-- Arrow down -->
  <line x1="726" y1="370" x2="726" y2="392" stroke="#1f7a7a" stroke-width="4" stroke-linecap="round"/>
  <path d="M715,388 L726,402 L737,388 Z" fill="#1f7a7a"/>

  <!-- Result box -->
  <rect x="502" y="408" width="448" height="124" rx="12" fill="#e3efee" stroke="#1f7a7a" stroke-width="3"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f1d1a">
    <text x="520" y="440" font-size="22" font-weight="700">Result: it always contains</text>
    <text x="520" y="468" font-size="20">a loop that follows the same rule:</text>
    <text x="520" y="494" font-size="20">5 same-color dots, 1-unit steps.</text>
    <text x="520" y="520" font-size="17" font-style="italic">Its spot and its color depend on the painting.</text>
  </g>
</svg>
