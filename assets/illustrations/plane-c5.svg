<svg xmlns="http://www.w3.org/2000/svg" width="840" height="327" viewBox="0 0 840 327" role="img" aria-labelledby="t d">
<title id="t">A same-color five-step loop is unavoidable</title>
<desc id="d">A striped two-color patch is illustrative; every two-coloring of the entire plane is allowed. The loop is an exact illustration from the two-circle construction. Its five consecutive edges all have equal length. A crossing is not a sixth vertex. The theorem does not prescribe a particular loop shape.</desc>
<rect x="0" y="0" width="840" height="327" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#192931" font-weight="700" text-anchor="start">Two colors. A same-color loop is unavoidable.</text><rect x="24" y="64" width="351" height="197" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><rect x="439" y="64" width="377" height="197" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="46" y="94" font-size="18" fill="#192931" font-weight="700" text-anchor="start">Color every point</text><text x="46" y="240" font-size="16" fill="#52636a" font-weight="600" text-anchor="start">Any pattern is allowed.</text><rect x="46" y="110" width="48" height="108" rx="0" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="94" y="110" width="48" height="108" rx="0" fill="#e7b566" stroke="none" stroke-width="1"/><rect x="142" y="110" width="48" height="108" rx="0" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="190" y="110" width="48" height="108" rx="0" fill="#e7b566" stroke="none" stroke-width="1"/><rect x="238" y="110" width="48" height="108" rx="0" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="286" y="110" width="48" height="108" rx="0" fill="#e7b566" stroke="none" stroke-width="1"/><line x1="386" y1="159" x2="427" y2="159" stroke="#176d68" stroke-width="3" stroke-linecap="round"/><polyline points="418,154 427,159 418,164" stroke="#176d68" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="617" y1="210" x2="718" y2="210" stroke="#245ca5" stroke-width="4" stroke-linecap="round"/><line x1="718" y1="210" x2="633.83333" y2="154.17015" stroke="#245ca5" stroke-width="4" stroke-linecap="round"/><line x1="633.83333" y1="154.17015" x2="560.23326" y2="223.33683" stroke="#245ca5" stroke-width="4" stroke-linecap="round"/><line x1="560.23326" y1="223.33683" x2="566.5" y2="122.53143" stroke="#245ca5" stroke-width="4" stroke-linecap="round"/><line x1="566.5" y1="122.53143" x2="617" y2="210" stroke="#245ca5" stroke-width="4" stroke-linecap="round"/><circle cx="617" cy="210" r="7" fill="#245ca5" stroke="#fffdfa" stroke-width="2"/><circle cx="718" cy="210" r="7" fill="#245ca5" stroke="#fffdfa" stroke-width="2"/><circle cx="633.83333" cy="154.17015" r="7" fill="#245ca5" stroke="#fffdfa" stroke-width="2"/><circle cx="560.23326" cy="223.33683" r="7" fill="#245ca5" stroke="#fffdfa" stroke-width="2"/><circle cx="566.5" cy="122.53143" r="7" fill="#245ca5" stroke="#fffdfa" stroke-width="2"/><text x="462" y="94" font-size="18" fill="#192931" font-weight="700" text-anchor="start">Find five points of one color</text><text x="627" y="241" font-size="17" fill="#245ca5" font-weight="700" text-anchor="middle">Each step is 1 unit.</text><rect x="24" y="273" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="300" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">Five unit steps. No fixed shape required.</text></g>
</svg>
