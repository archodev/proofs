<svg xmlns="http://www.w3.org/2000/svg" width="840" height="343" viewBox="0 0 840 343" role="img" aria-labelledby="t d">
<title id="t">The exact maximum: 52 box-free layers</title>
<desc id="d">The first two layers are exact 5-by-7 slices of the witness. Blue is one and gold is zero. The sketch shows how matching same-color rectangles at the same positions in two layers would form an eight-corner box. It does not occur in the displayed stack.</desc>
