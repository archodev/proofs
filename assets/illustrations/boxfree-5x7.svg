<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 315" width="860" height="315" role="img" aria-labelledby="t d">
  <title id="t">How tall can a stack avoid a same-color box?</title>
  <desc id="d">Each layer is a 5 by 7 grid where every cell is blue or gold. Layers are stacked on top of each other. The rule: no box may have all 8 of its corners the same color. Two sample layers, Layer 0 and Layer 1, are shown on the left. They come from a 52-layer stack that a computer checked, but they are only a sample, not the full proof. On the right, a diagram shows why a box appears: if the 4 corners of a rectangle are blue in one layer and the same 4 spots are blue in another layer, that makes 8 blue corners, which is a forbidden box. The same is true for gold. Result: 52 layers work, and 53 layers are impossible because every 53-layer stack must contain such a box.</desc>

  <rect x="0" y="0" width="860" height="315" fill="#faf7ef"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2328">
    <!-- Title and setup -->
    <text x="35" y="36" font-size="26" font-weight="700">How tall can a stack avoid a same-color box?</text>
    <text x="35" y="62" font-size="15">Fill 5 × 7 grids with blue or gold, then stack them. Rule: no box whose 8 corners all match.</text>

    <!-- Layer labels -->
    <text x="130" y="89" font-size="16" font-weight="700" text-anchor="middle">Layer 0</text>
    <text x="360" y="89" font-size="16" font-weight="700" text-anchor="middle">Layer 1</text>

    <!-- Reserved for the two real layers (x=35..225 and x=265..455, y=111..246) -->
    <g id="insert-witness"><rect x="35" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="0" data-col="0" data-bit="0"/><rect x="62" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="0" data-col="1" data-bit="0"/><rect x="89" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="0" data-col="2" data-bit="0"/><rect x="116" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="0" data-col="3" data-bit="1"/><rect x="143" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="0" data-col="4" data-bit="1"/><rect x="170" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="0" data-col="5" data-bit="0"/><rect x="197" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="0" data-col="6" data-bit="1"/><rect x="35" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="1" data-col="0" data-bit="0"/><rect x="62" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="1" data-col="1" data-bit="1"/><rect x="89" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="1" data-col="2" data-bit="0"/><rect x="116" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="1" data-col="3" data-bit="0"/><rect x="143" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="1" data-col="4" data-bit="0"/><rect x="170" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="1" data-col="5" data-bit="1"/><rect x="197" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="1" data-col="6" data-bit="1"/><rect x="35" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="2" data-col="0" data-bit="1"/><rect x="62" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="2" data-col="1" data-bit="1"/><rect x="89" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="2" data-col="2" data-bit="1"/><rect x="116" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="2" data-col="3" data-bit="0"/><rect x="143" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="2" data-col="4" data-bit="1"/><rect x="170" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="2" data-col="5" data-bit="0"/><rect x="197" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="2" data-col="6" data-bit="0"/><rect x="35" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="3" data-col="0" data-bit="1"/><rect x="62" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="3" data-col="1" data-bit="0"/><rect x="89" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="3" data-col="2" data-bit="1"/><rect x="116" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="3" data-col="3" data-bit="1"/><rect x="143" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="3" data-col="4" data-bit="0"/><rect x="170" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="3" data-col="5" data-bit="1"/><rect x="197" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="3" data-col="6" data-bit="0"/><rect x="35" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="4" data-col="0" data-bit="0"/><rect x="62" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="4" data-col="1" data-bit="1"/><rect x="89" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="4" data-col="2" data-bit="0"/><rect x="116" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="4" data-col="3" data-bit="1"/><rect x="143" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="4" data-col="4" data-bit="1"/><rect x="170" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="0" data-row="4" data-col="5" data-bit="1"/><rect x="197" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="0" data-row="4" data-col="6" data-bit="0"/><rect x="265" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="0" data-col="0" data-bit="1"/><rect x="292" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="0" data-col="1" data-bit="1"/><rect x="319" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="0" data-col="2" data-bit="0"/><rect x="346" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="0" data-col="3" data-bit="1"/><rect x="373" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="0" data-col="4" data-bit="0"/><rect x="400" y="111" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="0" data-col="5" data-bit="1"/><rect x="427" y="111" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="0" data-col="6" data-bit="0"/><rect x="265" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="1" data-col="0" data-bit="0"/><rect x="292" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="1" data-col="1" data-bit="1"/><rect x="319" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="1" data-col="2" data-bit="1"/><rect x="346" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="1" data-col="3" data-bit="1"/><rect x="373" y="138" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="1" data-col="4" data-bit="1"/><rect x="400" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="1" data-col="5" data-bit="0"/><rect x="427" y="138" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="1" data-col="6" data-bit="0"/><rect x="265" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="2" data-col="0" data-bit="1"/><rect x="292" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="2" data-col="1" data-bit="0"/><rect x="319" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="2" data-col="2" data-bit="0"/><rect x="346" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="2" data-col="3" data-bit="0"/><rect x="373" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="2" data-col="4" data-bit="1"/><rect x="400" y="165" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="2" data-col="5" data-bit="0"/><rect x="427" y="165" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="2" data-col="6" data-bit="1"/><rect x="265" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="3" data-col="0" data-bit="0"/><rect x="292" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="3" data-col="1" data-bit="0"/><rect x="319" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="3" data-col="2" data-bit="1"/><rect x="346" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="3" data-col="3" data-bit="0"/><rect x="373" y="192" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="3" data-col="4" data-bit="0"/><rect x="400" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="3" data-col="5" data-bit="1"/><rect x="427" y="192" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="3" data-col="6" data-bit="1"/><rect x="265" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="4" data-col="0" data-bit="0"/><rect x="292" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="4" data-col="1" data-bit="1"/><rect x="319" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="4" data-col="2" data-bit="0"/><rect x="346" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="4" data-col="3" data-bit="1"/><rect x="373" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="4" data-col="4" data-bit="0"/><rect x="400" y="219" width="24" height="24" fill="#e8af5b" rx="2" data-layer="1" data-row="4" data-col="5" data-bit="0"/><rect x="427" y="219" width="24" height="24" fill="#2165d4" rx="2" data-layer="1" data-row="4" data-col="6" data-bit="1"/></g>

    <!-- Caption under layers + key -->
    <text x="35" y="272" font-size="14">Two layers from the checked 52-layer stack —</text>
    <text x="35" y="294" font-size="14">a sample, not the whole proof.</text>
    <rect x="296" y="281" width="16" height="16" rx="2" fill="#2165d4" stroke="#1f2328" stroke-width="1.5"/>
    <text x="318" y="294" font-size="14">blue (1)</text>
    <rect x="383" y="281" width="16" height="16" rx="2" fill="#e8af5b" stroke="#1f2328" stroke-width="1.5"/>
    <text x="405" y="294" font-size="14">gold (0)</text>

    <!-- Right column: positive result -->
    <circle cx="497" cy="96" r="13" fill="#1a8a7d"/>
    <path d="M490 96 l5 5 l9 -10" fill="none" stroke="#faf7ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="518" y="106" font-size="28" font-weight="700" fill="#1a8a7d">52 layers work</text>
    <text x="484" y="130" font-size="13.5">A computer checked a 52-layer stack: no box.</text>

    <!-- Why diagram: two sheets, same rectangle, 8 corners -->
    <g stroke-linejoin="round">
      <!-- lower sheet -->
      <polygon points="490,234 600,234 630,210 520,210" fill="#efe8d6" stroke="#1f2328" stroke-width="2"/>
      <!-- vertical box edges (dashed, behind upper sheet) -->
      <g stroke="#2165d4" stroke-width="2.5" stroke-dasharray="5 4">
        <line x1="517.5" y1="228" x2="517.5" y2="176"/>
        <line x1="582.5" y1="228" x2="582.5" y2="176"/>
        <line x1="534" y1="214.8" x2="534" y2="162.8"/>
        <line x1="599" y1="214.8" x2="599" y2="162.8"/>
      </g>
      <polygon points="517.5,228 582.5,228 599,214.8 534,214.8" fill="none" stroke="#2165d4" stroke-width="2.5"/>
      <g fill="#2165d4" stroke="#1f2328" stroke-width="1.5">
        <circle cx="517.5" cy="228" r="5.5"/>
        <circle cx="582.5" cy="228" r="5.5"/>
        <circle cx="534" cy="214.8" r="5.5"/>
        <circle cx="599" cy="214.8" r="5.5"/>
      </g>
      <!-- upper sheet -->
      <polygon points="490,182 600,182 630,158 520,158" fill="#efe8d6" fill-opacity="0.75" stroke="#1f2328" stroke-width="2"/>
      <polygon points="517.5,176 582.5,176 599,162.8 534,162.8" fill="none" stroke="#2165d4" stroke-width="2.5"/>
      <g fill="#2165d4" stroke="#1f2328" stroke-width="1.5">
        <circle cx="517.5" cy="176" r="5.5"/>
        <circle cx="582.5" cy="176" r="5.5"/>
        <circle cx="534" cy="162.8" r="5.5"/>
        <circle cx="599" cy="162.8" r="5.5"/>
      </g>
    </g>

    <text x="650" y="160" font-size="13.5">4 blue corners of a</text>
    <text x="650" y="177" font-size="13.5">rectangle, at the same</text>
    <text x="650" y="194" font-size="13.5">spots in 2 layers</text>
    <text x="650" y="211" font-size="13.5" font-weight="700">= 8 blue corners</text>
    <text x="650" y="228" font-size="13.5" font-weight="700" fill="#b4532a">= a forbidden box.</text>
    <text x="650" y="245" font-size="13.5">(Gold counts too.)</text>

    <line x1="484" y1="258" x2="827" y2="258" stroke="#1f2328" stroke-opacity="0.25" stroke-width="1.5"/>

    <!-- Right column: negative result -->
    <circle cx="497" cy="275" r="13" fill="#b4532a"/>
    <path d="M491.5 269.5 l11 11 M502.5 269.5 l-11 11" stroke="#faf7ef" stroke-width="3" stroke-linecap="round"/>
    <text x="518" y="285" font-size="28" font-weight="700" fill="#b4532a">53 are impossible</text>
    <text x="484" y="306" font-size="13">Any 53-layer stack is forced to contain a box.</text>
  </g>
</svg>
