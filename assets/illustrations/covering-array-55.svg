<svg xmlns="http://www.w3.org/2000/svg" width="840" height="317" viewBox="0 0 840 317" role="img" aria-labelledby="t d">
<title id="t">Exactly 56 runs for every five-flag pattern</title>
<desc id="d">A schematic test with ten binary flags illustrates the test pattern on flags 1, 3, 5, 7 and 9. The full suite must realize all 32 patterns on every five-flag selection. It takes exactly 56 runs, compared with 1,024 runs for full ten-flag coverage.</desc>
<rect x="0" y="0" width="840" height="317" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
