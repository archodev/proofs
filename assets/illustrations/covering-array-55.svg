" y="148" font-size="22" fill="#192931" font-weight="700" text-anchor="middle">0</text><rect x="500" y="97" width="64" height="65" rx="8" fill="#245ca5" stroke="none" stroke-width="1"/><text x="532" y="120" font-size="12" fill="#fffdfa" font-weight="600" text-anchor="middle">Flag 7</text><text x="532" y="148" font-size="22" fill="#fffdfa" font-weight="700" text-anchor="middle">0</text><rect x="578" y="97" width="64" height="65" rx="8" fill="#e9e6de" stroke="none" stroke-width="1"/><text x="610" y="120" font-size="12" fill="#52636a" font-weight="600" text-anchor="middle">Flag 8</text><text x="610" y="148" font-size="22" fill="#192931" font-weight="700" text-anchor="middle">1</text><rect x="656" y="97" width="64" height="65" rx="8" fill="#245ca5" stroke="none" stroke-width="1"/><text x="688" y="120" font-size="12" fill="#fffdfa" font-weight="600" text-anchor="middle">Flag 9</text><text x="688" y="148" font-size="22" fill="#fffdfa" font-weight="700" text-anchor="middle">1</text><rect x="734" y="97" width="64" height="65" rx="8" fill="#e9e6de" stroke="none" stroke-width="1"/><text x="766" y="120" font-size="12" fill="#52636a" font-weight="600" text-anchor="middle">Flag 10</text><text x="766" y="148" font-size="22" fill="#192931" font-weight="700" text-anchor="middle">0</text><text x="32" y="190" font-size="20" fill="#245ca5" font-weight="700" text-anchor="start">Selected flags: 1 0 1 0 1</text><text x="32" y="220" font-size="17" fill="#52636a" font-weight="600" text-anchor="start">Get all 32 patterns for every possible choice of five.</text><rect x="24" y="242" width="389" height="59" rx="10" fill="#e6efee" stroke="none" stroke-width="1"/><text x="42" y="279" font-size="29" fill="#176d68" font-weight="750" text-anchor="start">56</text><text x="98" y="277" font-size="18" fill="#176d68" font-weight="700" text-anchor="start">tests are enough. 55 aren’t.</text><rect x="428" y="242" width="388" height="59" rx="10" fill="#e9e6de" stroke="none" stroke-width="1"/><text x="446" 