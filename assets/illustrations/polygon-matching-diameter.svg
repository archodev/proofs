<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Change the pairings without changing the number of handles</title>
  <desc id="d">Three hexagons in a row. Each hexagon has its sides numbered 1 to 6 around the rim, and lines join the middles of sides that get glued together. Gluing turns each hexagon into a surface with one handle, like a donut. Start: pairs 1–2, 3–5, 4–6. Swap 1 keeps pair 4–6 and re-pairs sides 1, 2, 3, 5, giving pairs 1–3, 2–5, 4–6. Swap 2 keeps pair 1–3 and re-pairs sides 2, 4, 5, 6, giving pairs 1–3, 2–4, 5–6. Re-paired sides and lines are rust; kept ones are teal. Every panel still glues up to one handle. Takeaway: with 2g+1 pairs of sides, where g is the number of handles, any pairing can be turned into any other pairing with the same g handles in at most 32g swaps. Here g is 1, so at most 32; this example took 2. The bound is only for 2g+1 pairs, not for polygons of every size.</desc>

  <rect x="0" y="0" width="1240" height="800" fill="#faf7ef"/>

  <!-- Title and setup -->
  <text x="620" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2328">Change the pairings without changing the number of handles</text>
  <text x="620" y="90" text-anchor="middle" font-size="21" fill="#3d4148">Lines join hexagon sides that get glued together. Gluing all three pairs makes a surface.</text>

  <!-- Legend -->
  <line x1="200" y1="120" x2="240" y2="120" stroke="#b5532a" stroke-width="6" stroke-linecap="round"/>
  <text x="252" y="127" font-size="19" fill="#1f2328">re-paired by the swap</text>
  <line x1="500" y1="120" x2="540" y2="120" stroke="#1b7f79" stroke-width="6" stroke-linecap="round"/>
  <text x="552" y="127" font-size="19" fill="#1f2328">kept by the swap</text>
  <text x="760" y="127" font-size="19" fill="#3d4148">Crossings are not joins</text>

  <!-- Panel cards -->
  <rect x="30" y="145" width="310" height="450" rx="16" fill="#fffdf8" stroke="#d9d1bf" stroke-width="2"/>
  <rect x="465" y="145" width="310" height="450" rx="16" fill="#fffdf8" stroke="#d9d1bf" stroke-width="2"/>
  <rect x="900" y="145" width="310" height="450" rx="16" fill="#fffdf8" stroke="#d9d1bf" stroke-width="2"/>

  <text x="185" y="184" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">Start</text>
  <text x="620" y="184" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">After swap 1</text>
  <text x="1055" y="184" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2328">After swap 2</text>

  <!-- ===== Panel 1: 1-2, 3-5, 4-6 ===== -->
  <g transform="translate(185,345)">
    <polygon points="110,0 55,95.26 -55,95.26 -110,0 -55,-95.26 55,-95.26" fill="#f3efe4"/>
    <g stroke="#1f2328" stroke-width="5" stroke-linecap="round">
      <line x1="-55" y1="-95.26" x2="55" y2="-95.26"/>
      <line x1="55" y1="-95.26" x2="110" y2="0"/>
      <line x1="110" y1="0" x2="55" y2="95.26"/>
      <line x1="55" y1="95.26" x2="-55" y2="95.26"/>
      <line x1="-55" y1="95.26" x2="-110" y2="0"/>
      <line x1="-110" y1="0" x2="-55" y2="-95.26"/>
    </g>
    <g stroke="#2f5f98" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-95.26" x2="82.5" y2="-47.63"/>
      <line x1="82.5" y1="47.63" x2="-82.5" y2="47.63"/>
      <line x1="0" y1="95.26" x2="-82.5" y2="-47.63"/>
    </g>
    <g fill="#2f5f98">
      <circle cx="0" cy="-95.26" r="6.5"/><circle cx="82.5" cy="-47.63" r="6.5"/>
      <circle cx="82.5" cy="47.63" r="6.5"/><circle cx="0" cy="95.26" r="6.5"/>
      <circle cx="-82.5" cy="47.63" r="6.5"/><circle cx="-82.5" cy="-47.63" r="6.5"/>
    </g>
    <g fill="#ffffff" stroke="#1f2328" stroke-width="2.5">
      <circle cx="0" cy="-126" r="16"/><circle cx="109.1" cy="-63" r="16"/>
      <circle cx="109.1" cy="63" r="16"/><circle cx="0" cy="126" r="16"/>
      <circle cx="-109.1" cy="63" r="16"/><circle cx="-109.1" cy="-63" r="16"/>
    </g>
    <g font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">
      <text x="0" y="-119">1</text><text x="109.1" y="-56">2</text>
      <text x="109.1" y="70">3</text><text x="0" y="133">4</text>
      <text x="-109.1" y="70">5</text><text x="-109.1" y="-56">6</text>
    </g>
  </g>
  <text x="185" y="524" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Pairs: 1–2, 3–5, 4–6</text>

  <!-- ===== Panel 2: 1-3, 2-5, 4-6 ===== -->
  <g transform="translate(620,345)">
    <polygon points="110,0 55,95.26 -55,95.26 -110,0 -55,-95.26 55,-95.26" fill="#f3efe4"/>
    <g stroke-width="7" stroke-linecap="round">
      <line x1="-55" y1="-95.26" x2="55" y2="-95.26" stroke="#b5532a"/>
      <line x1="55" y1="-95.26" x2="110" y2="0" stroke="#b5532a"/>
      <line x1="110" y1="0" x2="55" y2="95.26" stroke="#b5532a"/>
      <line x1="55" y1="95.26" x2="-55" y2="95.26" stroke="#1b7f79"/>
      <line x1="-55" y1="95.26" x2="-110" y2="0" stroke="#b5532a"/>
      <line x1="-110" y1="0" x2="-55" y2="-95.26" stroke="#1b7f79"/>
    </g>
    <g stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-95.26" x2="82.5" y2="47.63" stroke="#b5532a"/>
      <line x1="82.5" y1="-47.63" x2="-82.5" y2="47.63" stroke="#b5532a"/>
      <line x1="0" y1="95.26" x2="-82.5" y2="-47.63" stroke="#1b7f79"/>
    </g>
    <g>
      <circle cx="0" cy="-95.26" r="6.5" fill="#b5532a"/><circle cx="82.5" cy="-47.63" r="6.5" fill="#b5532a"/>
      <circle cx="82.5" cy="47.63" r="6.5" fill="#b5532a"/><circle cx="0" cy="95.26" r="6.5" fill="#1b7f79"/>
      <circle cx="-82.5" cy="47.63" r="6.5" fill="#b5532a"/><circle cx="-82.5" cy="-47.63" r="6.5" fill="#1b7f79"/>
    </g>
    <g fill="#ffffff" stroke-width="2.5">
      <circle cx="0" cy="-126" r="16" stroke="#b5532a"/><circle cx="109.1" cy="-63" r="16" stroke="#b5532a"/>
      <circle cx="109.1" cy="63" r="16" stroke="#b5532a"/><circle cx="0" cy="126" r="16" stroke="#1b7f79"/>
      <circle cx="-109.1" cy="63" r="16" stroke="#b5532a"/><circle cx="-109.1" cy="-63" r="16" stroke="#1b7f79"/>
    </g>
    <g font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">
      <text x="0" y="-119">1</text><text x="109.1" y="-56">2</text>
      <text x="109.1" y="70">3</text><text x="0" y="133">4</text>
      <text x="-109.1" y="70">5</text><text x="-109.1" y="-56">6</text>
    </g>
  </g>
  <text x="620" y="524" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Pairs: 1–3, 2–5, 4–6</text>

  <!-- ===== Panel 3: 1-3, 2-4, 5-6 ===== -->
  <g transform="translate(1055,345)">
    <polygon points="110,0 55,95.26 -55,95.26 -110,0 -55,-95.26 55,-95.26" fill="#f3efe4"/>
    <g stroke-width="7" stroke-linecap="round">
      <line x1="-55" y1="-95.26" x2="55" y2="-95.26" stroke="#1b7f79"/>
      <line x1="55" y1="-95.26" x2="110" y2="0" stroke="#b5532a"/>
      <line x1="110" y1="0" x2="55" y2="95.26" stroke="#1b7f79"/>
      <line x1="55" y1="95.26" x2="-55" y2="95.26" stroke="#b5532a"/>
      <line x1="-55" y1="95.26" x2="-110" y2="0" stroke="#b5532a"/>
      <line x1="-110" y1="0" x2="-55" y2="-95.26" stroke="#b5532a"/>
    </g>
    <g stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-95.26" x2="82.5" y2="47.63" stroke="#1b7f79"/>
      <line x1="82.5" y1="-47.63" x2="0" y2="95.26" stroke="#b5532a"/>
      <line x1="-82.5" y1="47.63" x2="-82.5" y2="-47.63" stroke="#b5532a"/>
    </g>
    <g>
      <circle cx="0" cy="-95.26" r="6.5" fill="#1b7f79"/><circle cx="82.5" cy="-47.63" r="6.5" fill="#b5532a"/>
      <circle cx="82.5" cy="47.63" r="6.5" fill="#1b7f79"/><circle cx="0" cy="95.26" r="6.5" fill="#b5532a"/>
      <circle cx="-82.5" cy="47.63" r="6.5" fill="#b5532a"/><circle cx="-82.5" cy="-47.63" r="6.5" fill="#b5532a"/>
    </g>
    <g fill="#ffffff" stroke-width="2.5">
      <circle cx="0" cy="-126" r="16" stroke="#1b7f79"/><circle cx="109.1" cy="-63" r="16" stroke="#b5532a"/>
      <circle cx="109.1" cy="63" r="16" stroke="#1b7f79"/><circle cx="0" cy="126" r="16" stroke="#b5532a"/>
      <circle cx="-109.1" cy="63" r="16" stroke="#b5532a"/><circle cx="-109.1" cy="-63" r="16" stroke="#b5532a"/>
    </g>
    <g font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle">
      <text x="0" y="-119">1</text><text x="109.1" y="-56">2</text>
      <text x="109.1" y="70">3</text><text x="0" y="133">4</text>
      <text x="-109.1" y="70">5</text><text x="-109.1" y="-56">6</text>
    </g>
  </g>
  <text x="1055" y="524" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2328">Pairs: 1–3, 2–4, 5–6</text>

  <!-- "1 handle" badges with donut icons -->
  <g>
    <ellipse cx="97" cy="562" rx="24" ry="13" fill="#d9ece9" stroke="#1f2328" stroke-width="2.5"/>
    <ellipse cx="97" cy="562" rx="9" ry="3.5" fill="#fffdf8" stroke="#1f2328" stroke-width="2"/>
    <text x="129" y="570" font-size="22" font-weight="700" fill="#1f2328">glued: 1 handle</text>

    <ellipse cx="532" cy="562" rx="24" ry="13" fill="#d9ece9" stroke="#1f2328" stroke-width="2.5"/>
    <ellipse cx="532" cy="562" rx="9" ry="3.5" fill="#fffdf8" stroke="#1f2328" stroke-width="2"/>
    <text x="564" y="570" font-size="22" font-weight="700" fill="#1f2328">glued: 1 handle</text>

    <ellipse cx="967" cy="562" rx="24" ry="13" fill="#d9ece9" stroke="#1f2328" stroke-width="2.5"/>
    <ellipse cx="967" cy="562" rx="9" ry="3.5" fill="#fffdf8" stroke="#1f2328" stroke-width="2"/>
    <text x="999" y="570" font-size="22" font-weight="700" fill="#1f2328">glued: 1 handle</text>
  </g>

  <!-- Arrows between panels -->
  <text x="402.5" y="322" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">swap 1</text>
  <line x1="352" y1="345" x2="440" y2="345" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <polygon points="453,345 436,334 436,356" fill="#1f2328"/>
  <text x="402.5" y="382" text-anchor="middle" font-size="18" fill="#3d4148">keeps</text>
  <text x="402.5" y="407" text-anchor="middle" font-size="21" font-weight="700" fill="#1b7f79">4–6</text>

  <text x="837.5" y="322" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2328">swap 2</text>
  <line x1="787" y1="345" x2="875" y2="345" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <polygon points="888,345 871,334 871,356" fill="#1f2328"/>
  <text x="837.5" y="382" text-anchor="middle" font-size="18" fill="#3d4148">keeps</text>
  <text x="837.5" y="407" text-anchor="middle" font-size="21" font-weight="700" fill="#1b7f79">1–3</text>

  <!-- Takeaway -->
  <rect x="30" y="615" width="1180" height="165" rx="16" fill="#f1ebdc" stroke="#d9d1bf" stroke-width="2"/>
  <text x="60" y="652" font-size="24" font-weight="700" fill="#1f2328">What was shown: a short chain of swaps always works</text>
  <text x="60" y="684" font-size="21" fill="#1f2328">A swap re-pairs 4 sides and keeps the others. Using 2g + 1 pairs, where g = number of handles,</text>
  <text x="60" y="712" font-size="21" fill="#1f2328">any pairing can be turned into any other with the same g handles in <tspan font-weight="700" fill="#b5532a">at most 32g swaps</tspan>.</text>
  <text x="60" y="742" font-size="19" fill="#3d4148">Here g = 1 and there are 3 pairs: at most 32 swaps (this example took 2).</text>
  <text x="60" y="768" font-size="19" fill="#3d4148">Only for 2g + 1 pairs, not a bound for polygons of every size.</text>
</svg>
