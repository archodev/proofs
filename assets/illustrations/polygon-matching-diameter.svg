192931" font-weight="700" text-anchor="middle">6</text><text x="140" y="242" font-size="14" fill="#192931" font-weight="700" text-anchor="middle">1–2 · 3–5 · 4–6</text><text x="149" y="262" font-size="13" fill="#176d68" font-weight="650" text-anchor="middle">1 handle</text><ellipse cx="112" cy="257" rx="10" ry="6" fill="#e6efee" stroke="#176d68" stroke-width="1.5"/><ellipse cx="112" cy="257" rx="3.7" ry="2" fill="#fffdfa" stroke="#176d68" stroke-width="1"/><rect x="316" y="68" width="208" height="201" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="420" y="95" font-size="15" fill="#52636a" font-weight="700" text-anchor="middle">SWAP 1</text><polygon points="396,123.43078 444,123.43078 468,165 444,206.56922 396,206.56922 372,165" stroke="#192931" stroke-width="2" fill="#fffdfa" stroke-linejoin="round" stroke-linecap="round"/><line x1="420" y1="123.43078" x2="456" y2="185.78461" stroke="#245ca5" stroke-width="3" stroke-linecap="round"/><line x1="456" y1="144.21539" x2="384" y2="185.78461" stroke="#245ca5" stroke-width="3" stroke-linecap="round"/><line x1="420" y1="206.56922" x2="384" y2="144.21539" stroke="#176d68" stroke-width="3" stroke-linecap="round"/><circle cx="420" cy="123.43078" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="420" y="112.46586" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">1</text><circle cx="456" cy="144.21539" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="468.96" y="140.73293" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">2</text><circle cx="456" cy="185.78461" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="468.96" y="197.26707" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">3</text><circle cx="420" cy="206.56922" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="420" y="225.53414" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">4</text><circle cx="384" cy="185.78461" r="3" fill=