<svg xmlns="http://www.w3.org/2000/svg" width="840" height="334" viewBox="0 0 840 334" role="img" aria-labelledby="t d">
<title id="t">Change the pairings without changing the number of handles</title>
<desc id="d">The sides of each hexagon are glued in the three indicated pairs. Each panel produces one handle. The first swap keeps pair 4–6; the second keeps pair 1–3. Crossing lines are not vertices. The theorem bounds the wider family with 2g+1 pairs by 32g swaps.</desc>
<rect x="0" y="0" width="840" height="334" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
