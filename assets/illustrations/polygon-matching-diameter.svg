192931" font-weight="700" text-anchor="middle">3</text><circle cx="700" cy="206.56922" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="700" y="225.53414" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">4</text><circle cx="664" cy="185.78461" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="651.04" y="197.26707" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">5</text><circle cx="664" cy="144.21539" r="3" fill="#192931" stroke="none" stroke-width="1"/><text x="651.04" y="140.73293" font-size="12" fill="#192931" font-weight="700" text-anchor="middle">6</text><text x="700" y="242" font-size="14" fill="#192931" font-weight="700" text-anchor="middle">1–3 · 2–4 · 5–6</text><text x="709" y="262" font-size="13" fill="#176d68" font-weight="650" text-anchor="middle">1 handle</text><ellipse cx="672" cy="257" rx="10" ry="6" fill="#e6efee" stroke="#176d68" stroke-width="1.5"/><ellipse cx="672" cy="257" rx="3.7" ry="2" fill="#fffdfa" stroke="#176d68" stroke-width="1"/><line x1="254" y1="161" x2="306" y2="161" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="297,156 306,161 297,166" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="280" y="186" font-size="12" fill="#52636a" font-weight="700" text-anchor="middle">Keep 4–6</text><line x1="534" y1="161" x2="586" y2="161" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="577,156 586,161 577,166" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="186" font-size="12" fill="#52636a" font-weight="700" text-anchor="middle">Keep 1–3</text><rect x="24" y="279" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="306" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">With 2g + 1 pairs and g handles, at most 32g swaps suffice.</text></g>
