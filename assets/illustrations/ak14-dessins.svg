<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="title desc"><title id="title">Same branching map, different labels</title><desc id="desc">Degree-three example of simultaneous relabeling of an ordered product-one permutation triple. Fixed points are omitted.</desc><rect width="820" height="310" rx="22" fill="#f3f7fc"/><g font-family="system-ui,sans-serif"><text x="30" y="39" fill="#112a43" font-size="25" font-weight="700" text-anchor="start">Same branching map, different labels</text><rect x="35" y="70" width="345" height="194" rx="15" fill="#fff"/><rect x="440" y="70" width="345" height="194" rx="15" fill="#fff"/><text x="56" y="104" fill="#112a43" font-size="20" font-weight="700" text-anchor="start">Original labels</text><text x="56" y="140" fill="#2165d4" font-size="17" font-weight="650" text-anchor="start">Branch 0</text><text x="172" y="140" fill="#112a43" font-size="19" font-weight="600" text-anchor="start">(1 2)</text><text x="56" y="183" fill="#007d75" font-size="17" font-weight="650" text-anchor="start">Branch 1</text><text x="172" y="183" fill="#112a43" font-size="19" font-weight="600" text-anchor="start">(1 2 3)</text><text x="56" y="226" fill="#b65329" font-size="17" font-weight="650" text-anchor="start">Branch ∞</text><text x="172" y="226" fill="#112a43" font-size="19" font-weight="600" text-anchor="start">(2 3)</text><text x="461" y="104" fill="#112a43" font-size="20" font-weight="700" text-anchor="start">Relabeled sheets</text><text x="461" y="140" fill="#2165d4" font-size="17" font-weight="650" text-anchor="start">Branch 0</text><text x="577" y="140" fill="#112a43" font-size="19" font-weight="600" text-anchor="start">(2 3)</text><text x="461" y="183" fill="#007d75" font-size="17" font-weight="650" text-anchor="start">Branch 1</text><text x="577" y="183" fill="#112a43" font-size="19" font-weight="600" text-anchor="start">(2 3 1)</text><text x="461" y="226" fill="#b65329" font-size="17" font-weight="650" text-anchor="start">Branch ∞</text><text x="577" y="226" fill="#112a43" font-size="19" font-weight="600" text-anchor="start">(3 1)</text><path d="M392 152 H428 M420 144 L428 152 L420 160" fill="none" stroke="#2165d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="410" y="294" fill="#4d6073" font-size="17" font-weight="600" text-anchor="middle">Example: send 1 to 2, 2 to 3, and 3 to 1 in all three cycles.</text></g></svg>
