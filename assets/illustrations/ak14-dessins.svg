<svg xmlns="http://www.w3.org/2000/svg" width="840" height="333" viewBox="0 0 840 333" role="img" aria-labelledby="t d">
<title id="t">Same map, different sheet labels</title>
<desc id="d">A degree-three example of one common relabeling applied to the permutations at the three branch points. The theorem proves uniqueness in the two specified families, not existence. This illustration shows the relabeling, not the entire proof.</desc>
<rect x="0" y="0" width="840" height="333" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#192931" font-weight="700" text-anchor="start">Only the names of the sheets change</text><text x="33" y="84" font-size="16" fill="#52636a" font-weight="700" text-anchor="start">Walk around</text><text x="290" y="84" font-size="15" fill="#245ca5" font-weight="700" text-anchor="middle">BEFORE</text><text x="496" y="84" font-size="15" fill="#176d68" font-weight="700" text-anchor="middle">AFTER</text><rect x="25" y="96" width="566" height="40" rx="7" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="39" y="122" font-size="18" fill="#192931" font-weight="650" text-anchor="start">Point 0</text><text x="290" y="122" font-size="22" fill="#245ca5" font-weight="700" text-anchor="middle">(1 2)</text><line x1="366" y1="116" x2="418" y2="116" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="409,111 418,116 409,121" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="496" y="122" font-size="22" fill="#176d68" font-weight="700" text-anchor="middle">(2 3)</text><rect x="25" y="144" width="566" height="40" rx="7" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="39" y="170" font-size="18" fill="#192931" font-weight="650" text-anchor="start">Point 1</text><text x="290" y="170" font-size="22" fill="#245ca5" font-weight="700" text-anchor="middle">(1 2 3)</text><line x1="366" y1="164" x2="418" y2="164" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="409,159 418,164 409,169" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="496" y="170" font-size="22" fill="#176d68" font-weight="700" text-anchor="middle">(2 3 1)</text><rect x="25" y="192" width="566" height="40" rx="7" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="39" y="218" font-size="18" fill="#192931" font-weight="650" text-anchor="start">Point ∞</text><text x="290" y="218" font-size="22" fill="#245ca5" font-weight="700" text-anchor="middle">(2 3)</text><line x1="366" y1="212" x2="418" y2="212" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="409,207 418,212 409,217" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="496" y="218" font-size="22" fill="#176d68" font-weight="700" text-anchor="middle">(3 1)</text><rect x="610" y="96" width="206" height="137" rx="14" fill="#e6efee" stroke="#d8d4c9" stroke-width="1"/><text x="713" y="121" font-size="14" fill="#176d68" font-weight="700" text-anchor="middle">SAME RENAMING</text><text x="672" y="148" font-size="16" fill="#245ca5" font-weight="700" text-anchor="middle">1</text><line x1="686" y1="143" x2="733" y2="143" stroke="#176d68" stroke-width="2" stroke-linecap="round"/><polyline points="724,138 733,143 724,148" stroke="#176d68" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="750" y="148" font-size="16" fill="#176d68" font-weight="700" text-anchor="middle">2</text><text x="672" y="176" font-size="16" fill="#245ca5" font-weight="700" text-anchor="middle">2</text><line x1="686" y1="171" x2="733" y2="171" stroke="#176d68" stroke-width="2" stroke-linecap="round"/><polyline points="724,166 733,171 724,176" stroke="#176d68" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="750" y="176" font-size="16" fill="#176d68" font-weight="700" text-anchor="middle">3</text><text x="672" y="204" font-size="16" fill="#245ca5" font-weight="700" text-anchor="middle">3</text><line x1="686" y1="199" x2="733" y2="199" stroke="#176d68" stroke-width="2" stroke-linecap="round"/><polyline points="724,194 733,199 724,204" stroke="#176d68" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="750" y="204" font-size="16" fill="#176d68" font-weight="700" text-anchor="middle">1</text><text x="34" y="260" font-size="16" fill="#52636a" font-weight="600" text-anchor="start">(1 2) means swap sheets 1 and 2.</text><rect x="24" y="277" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="304" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">In these two families, the branching fixes the map up to renaming.</text></g>
</svg>
