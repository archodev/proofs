<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Same map, different labels</title>
  <desc id="d">A map with three numbered sheets has three special points, 0, 1 and infinity. Walking a loop around each point shuffles the sheets. With the original names the shuffles are (1 2), (1 2 3) and (2 3). If every sheet is renamed by the same rule, 1 becomes 2, 2 becomes 3 and 3 becomes 1, the shuffles read (2 3), (2 3 1) and (3 1). Drawn as arrows between numbered circles, they describe the same map with new names. The notation (1 2) means swap sheets 1 and 2. (1 2 3) means 1 goes to 2, 2 goes to 3, and 3 goes back to 1. Takeaway: for the two families in the theorem, the branching patterns pin down one oriented map up to renaming the sheets. This picture shows the renaming only. It does not show that the map exists, and it does not show the proof.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5f9e"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f7a75"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b5532a"/></marker>
  </defs>

  <rect width="960" height="545" fill="#faf7ef"/>

  <!-- Title -->
  <text x="30" y="42" font-size="30" font-weight="700" fill="#1f2328">Same map, different labels</text>
  <text x="30" y="72" font-size="17" fill="#1f2328">This map has 3 numbered sheets. Walking around each special point (0, 1, ∞) shuffles them.</text>

  <!-- Column headers -->
  <g font-size="17" font-weight="700" fill="#1f2328" text-anchor="middle">
    <text x="275" y="100">Loop around 0</text>
    <text x="425" y="100">Loop around 1</text>
    <text x="575" y="100">Loop around ∞</text>
  </g>

  <!-- Row bands -->
  <rect x="20" y="108" width="625" height="140" rx="12" fill="#e8eef6" stroke="#2b5f9e" stroke-width="2"/>
  <rect x="20" y="286" width="625" height="140" rx="12" fill="#e4f1ef" stroke="#1f7a75" stroke-width="2"/>

  <!-- Row labels -->
  <g font-size="19" font-weight="700">
    <text x="36" y="164" fill="#2b5f9e">Original</text>
    <text x="36" y="188" fill="#2b5f9e">names</text>
    <text x="36" y="342" fill="#1f7a75">After</text>
    <text x="36" y="366" fill="#1f7a75">renaming</text>
  </g>

  <!-- Rename band -->
  <text x="36" y="273" font-size="16" font-weight="700" fill="#b5532a">Rename every sheet</text>
  <g stroke="#b5532a" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#ar)">
    <line x1="275" y1="252" x2="275" y2="281"/>
    <line x1="425" y1="252" x2="425" y2="281"/>
    <line x1="575" y1="252" x2="575" y2="281"/>
  </g>

  <!-- ROW 1 (blue), cy = 166 -->
  <!-- cell (1 2) at cx=275 -->
  <g stroke="#2b5f9e" stroke-width="3" fill="none">
    <line x1="264.6" y1="146" x2="243.4" y2="178" marker-start="url(#ab)" marker-end="url(#ab)"/>
  </g>
  <!-- cell (1 2 3) at cx=425 -->
  <g stroke="#2b5f9e" stroke-width="3" fill="none" marker-end="url(#ab)">
    <line x1="414.6" y1="146" x2="393.4" y2="178"/>
    <line x1="402" y1="194" x2="448" y2="194"/>
    <line x1="456.6" y1="178" x2="435.4" y2="146"/>
  </g>
  <!-- cell (2 3) at cx=575 -->
  <g stroke="#2b5f9e" stroke-width="3" fill="none">
    <line x1="552" y1="194" x2="598" y2="194" marker-start="url(#ab)" marker-end="url(#ab)"/>
  </g>

  <!-- ROW 2 (teal), cy = 344 -->
  <!-- cell (2 3) at cx=275 -->
  <g stroke="#1f7a75" stroke-width="3" fill="none">
    <line x1="252" y1="372" x2="298" y2="372" marker-start="url(#at)" marker-end="url(#at)"/>
  </g>
  <!-- cell (2 3 1) at cx=425 -->
  <g stroke="#1f7a75" stroke-width="3" fill="none" marker-end="url(#at)">
    <line x1="402" y1="372" x2="448" y2="372"/>
    <line x1="456.6" y1="356" x2="435.4" y2="324"/>
    <line x1="414.6" y1="324" x2="393.4" y2="356"/>
  </g>
  <!-- cell (3 1) at cx=575 -->
  <g stroke="#1f7a75" stroke-width="3" fill="none">
    <line x1="585.4" y1="324" x2="606.6" y2="356" marker-start="url(#at)" marker-end="url(#at)"/>
  </g>

  <!-- Sheet circles: 1 top, 2 lower-left, 3 lower-right -->
  <g font-size="17" font-weight="700" text-anchor="middle">
    <!-- row 1 -->
    <circle cx="275" cy="130" r="15" fill="#2b5f9e"/><text x="275" y="136" fill="#faf7ef">1</text>
    <circle cx="233" cy="194" r="15" fill="#2b5f9e"/><text x="233" y="200" fill="#faf7ef">2</text>
    <circle cx="317" cy="194" r="15" fill="#faf7ef" stroke="#2b5f9e" stroke-width="2.5" stroke-dasharray="4 3"/><text x="317" y="200" fill="#2b5f9e">3</text>

    <circle cx="425" cy="130" r="15" fill="#2b5f9e"/><text x="425" y="136" fill="#faf7ef">1</text>
    <circle cx="383" cy="194" r="15" fill="#2b5f9e"/><text x="383" y="200" fill="#faf7ef">2</text>
    <circle cx="467" cy="194" r="15" fill="#2b5f9e"/><text x="467" y="200" fill="#faf7ef">3</text>

    <circle cx="575" cy="130" r="15" fill="#faf7ef" stroke="#2b5f9e" stroke-width="2.5" stroke-dasharray="4 3"/><text x="575" y="136" fill="#2b5f9e">1</text>
    <circle cx="533" cy="194" r="15" fill="#2b5f9e"/><text x="533" y="200" fill="#faf7ef">2</text>
    <circle cx="617" cy="194" r="15" fill="#2b5f9e"/><text x="617" y="200" fill="#faf7ef">3</text>

    <!-- row 2 -->
    <circle cx="275" cy="308" r="15" fill="#faf7ef" stroke="#1f7a75" stroke-width="2.5" stroke-dasharray="4 3"/><text x="275" y="314" fill="#1f7a75">1</text>
    <circle cx="233" cy="372" r="15" fill="#1f7a75"/><text x="233" y="378" fill="#faf7ef">2</text>
    <circle cx="317" cy="372" r="15" fill="#1f7a75"/><text x="317" y="378" fill="#faf7ef">3</text>

    <circle cx="425" cy="308" r="15" fill="#1f7a75"/><text x="425" y="314" fill="#faf7ef">1</text>
    <circle cx="383" cy="372" r="15" fill="#1f7a75"/><text x="383" y="378" fill="#faf7ef">2</text>
    <circle cx="467" cy="372" r="15" fill="#1f7a75"/><text x="467" y="378" fill="#faf7ef">3</text>

    <circle cx="575" cy="308" r="15" fill="#1f7a75"/><text x="575" y="314" fill="#faf7ef">1</text>
    <circle cx="533" cy="372" r="15" fill="#faf7ef" stroke="#1f7a75" stroke-width="2.5" stroke-dasharray="4 3"/><text x="533" y="378" fill="#1f7a75">2</text>
    <circle cx="617" cy="372" r="15" fill="#1f7a75"/><text x="617" y="378" fill="#faf7ef">3</text>
  </g>

  <!-- Cycle notation -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <text x="275" y="236" fill="#2b5f9e">(1 2)</text>
    <text x="425" y="236" fill="#2b5f9e">(1 2 3)</text>
    <text x="575" y="236" fill="#2b5f9e">(2 3)</text>
    <text x="275" y="414" fill="#1f7a75">(2 3)</text>
    <text x="425" y="414" fill="#1f7a75">(2 3 1)</text>
    <text x="575" y="414" fill="#1f7a75">(3 1)</text>
  </g>

  <!-- Right panel: renaming rule + how to read -->
  <rect x="665" y="108" width="275" height="318" rx="12" fill="#faf7ef" stroke="#1f2328" stroke-width="2"/>
  <text x="682" y="136" font-size="18" font-weight="700" fill="#b5532a">Renaming rule (all 3 loops)</text>
  <g font-size="17" font-weight="700" text-anchor="middle">
    <circle cx="710" cy="164" r="14" fill="#2b5f9e"/><text x="710" y="170" fill="#faf7ef">1</text>
    <line x1="728" y1="164" x2="760" y2="164" stroke="#b5532a" stroke-width="3" marker-end="url(#ar)"/>
    <circle cx="778" cy="164" r="14" fill="#1f7a75"/><text x="778" y="170" fill="#faf7ef">2</text>

    <circle cx="710" cy="198" r="14" fill="#2b5f9e"/><text x="710" y="204" fill="#faf7ef">2</text>
    <line x1="728" y1="198" x2="760" y2="198" stroke="#b5532a" stroke-width="3" marker-end="url(#ar)"/>
    <circle cx="778" cy="198" r="14" fill="#1f7a75"/><text x="778" y="204" fill="#faf7ef">3</text>

    <circle cx="710" cy="232" r="14" fill="#2b5f9e"/><text x="710" y="238" fill="#faf7ef">3</text>
    <line x1="728" y1="232" x2="760" y2="232" stroke="#b5532a" stroke-width="3" marker-end="url(#ar)"/>
    <circle cx="778" cy="232" r="14" fill="#1f7a75"/><text x="778" y="238" fill="#faf7ef">1</text>
  </g>
  <text x="806" y="190" font-size="15" fill="#1f2328">old name</text>
  <text x="806" y="210" font-size="15" fill="#1f2328">new name</text>

  <line x1="682" y1="256" x2="923" y2="256" stroke="#1f2328" stroke-width="1.5"/>
  <text x="682" y="280" font-size="18" font-weight="700" fill="#1f2328">How to read</text>
  <g font-size="15.5" fill="#1f2328">
    <text x="682" y="304"><tspan font-weight="700">(1 2)</tspan> = swap sheets 1 and 2</text>
    <text x="682" y="328"><tspan font-weight="700">(1 2 3)</tspan> = 1 goes to 2,</text>
    <text x="682" y="348">2 goes to 3, 3 goes back to 1</text>
    <text x="682" y="372">Dashed circle = sheet stays put</text>
    <text x="682" y="400" font-weight="700" fill="#b5532a">Numbers are just names</text>
    <text x="682" y="418" font-weight="700" fill="#b5532a">for the sheets.</text>
  </g>

  <!-- Takeaway -->
  <line x1="20" y1="446" x2="940" y2="446" stroke="#1f2328" stroke-width="2"/>
  <g font-size="17" fill="#1f2328">
    <text x="30" y="472"><tspan font-weight="700">Takeaway:</tspan> for the two families in the theorem, the branching patterns pin down</text>
    <text x="30" y="496">one oriented map, up to renaming the sheets.</text>
    <text x="30" y="524" fill="#b5532a">This picture shows only the renaming. It does not show that the map exists, or the proof.</text>
  </g>
</svg>
