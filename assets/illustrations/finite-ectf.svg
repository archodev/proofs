<svg xmlns="http://www.w3.org/2000/svg" width="840" height="334" viewBox="0 0 840 334" role="img" aria-labelledby="t d">
<title id="t">One finite graph answers every allowed request</title>
<desc id="d">The pentagon shows just one request. Vertex 6 joins 1 and 3 and avoids 2 and 4. In the theorem, after choosing any size limit, one fixed finite triangle-free graph has a witness outside the request for every disjoint join and avoid list up to that size. The nodes to join must have no links between them. The requests on the right are schematic.</desc>
<rect x="0" y="0" width="840" height="334" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#192931" font-weight="700" text-anchor="start">One request is easy. Try answering them all.</text><rect x="24" y="64" width="360" height="204" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><rect x="402" y="64" width="414" height="204" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="45" y="94" font-size="15" fill="#52636a" font-weight="700" text-anchor="start">ONE REQUEST</text><text x="425" y="94" font-size="15" fill="#52636a" font-weight="700" text-anchor="start">EVERY ALLOWED REQUEST</text><line x1="118" y1="112" x2="173" y2="150" stroke="#192931" stroke-width="2.5" stroke-linecap="round"/><line x1="173" y1="150" x2="154" y2="224" stroke="#192931" stroke-width="2.5" stroke-linecap="round"/><line x1="154" y1="224" x2="82" y2="224" stroke="#192931" stroke-width="2.5" stroke-linecap="round"/><line x1="82" y1="224" x2="63" y2="150" stroke="#192931" stroke-width="2.5" stroke-linecap="round"/><line x1="63" y1="150" x2="118" y2="112" stroke="#192931" stroke-width="2.5" stroke-linecap="round"/><line x1="118" y1="173" x2="118" y2="112" stroke="#176d68" stroke-width="4" stroke-linecap="round"/><line x1="118" y1="173" x2="154" y2="224" stroke="#176d68" stroke-width="4" stroke-linecap="round"/><line x1="118" y1="173" x2="173" y2="150" stroke="#a54629" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="118" y1="173" x2="82" y2="224" stroke="#a54629" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><circle cx="118" cy="112" r="11" fill="#fffdfa" stroke="#176d68" stroke-width="1.5"/><text x="118" y="116" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">1</text><circle cx="173" cy="150" r="11" fill="#fffdfa" stroke="#192931" stroke-width="1.5"/><text x="173" y="154" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">2</text><circle cx="154" cy="224" r="11" fill="#fffdfa" stroke="#176d68" stroke-width="1.5"/><text x="154" y="228" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">3</text><circle cx="82" cy="224" r="11" fill="#fffdfa" stroke="#192931" stroke-width="1.5"/><text x="82" y="228" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">4</text><circle cx="63" cy="150" r="11" fill="#fffdfa" stroke="#192931" stroke-width="1.5"/><text x="63" y="154" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">5</text><circle cx="118" cy="173" r="11" fill="#176d68" stroke="#176d68" stroke-width="1.5"/><text x="118" y="177" font-size="11" fill="#fffdfa" font-weight="700" text-anchor="middle">6</text><text x="217" y="144" font-size="17" fill="#176d68" font-weight="700" text-anchor="start">Join 1 and 3</text><text x="217" y="174" font-size="17" fill="#a54629" font-weight="700" text-anchor="start">Avoid 2 and 4</text><text x="217" y="213" font-size="17" fill="#192931" font-weight="600" text-anchor="start">Point 6 works.</text><text x="217" y="238" font-size="14" fill="#52636a" font-weight="600" text-anchor="start">1 and 3 aren’t linked.</text><rect x="425" y="110" width="122" height="35" rx="7" fill="#e7edf8" stroke="none" stroke-width="1"/><text x="486" y="132" font-size="14" fill="#245ca5" font-weight="700" text-anchor="middle">Request 1</text><line x1="552" y1="127" x2="592" y2="174" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="589.97463,163.90555 592,174 582.35924,170.38674" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="425" y="154" width="122" height="35" rx="7" fill="#e7edf8" stroke="none" stroke-width="1"/><text x="486" y="176" font-size="14" fill="#245ca5" font-weight="700" text-anchor="middle">Request 2</text><line x1="552" y1="171" x2="592" y2="174" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="583.39916,168.34089 592,174 582.65126,178.31289" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="425" y="198" width="122" height="35" rx="7" fill="#e7edf8" stroke="none" stroke-width="1"/><text x="486" y="220" font-size="14" fill="#245ca5" font-weight="700" text-anchor="middle">Request 3</text><line x1="552" y1="215" x2="592" y2="174" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="582.13618,176.95042 592,174 589.294,183.93366" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="600" y="121" width="197" height="107" rx="10" fill="#e6efee" stroke="none" stroke-width="1"/><text x="698" y="151" font-size="15" fill="#176d68" font-weight="700" text-anchor="middle">ONE FIXED FINITE</text><text x="698" y="177" font-size="18" fill="#176d68" font-weight="700" text-anchor="middle">triangle-free graph</text><text x="698" y="201" font-size="11" fill="#52636a" font-weight="600" text-anchor="middle">All witnesses already inside</text><rect x="24" y="278" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="305" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">Any size limit. No adding vertices after a request.</text></g>
</svg>
