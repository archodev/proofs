<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390" role="img" aria-labelledby="t d">
<title id="t">Cherlin’s triangle-free graph problem, proved for every size limit</title>
<desc id="d">Cherlin posed the problem in 1992. At the 2026 Barbados workshop, no finite example was known even for size limit four. The pictured vertex 6 answers only one request. The Lean result constructs, for each size limit, one finite triangle-free graph already containing an outside witness for every allowed request up to that limit. Join targets must be pairwise unlinked. The theorem checks finite graphs, not the equivalent model-theoretic Henson graph formulation itself.</desc>
<rect x="0" y="0" width="840" height="390" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
