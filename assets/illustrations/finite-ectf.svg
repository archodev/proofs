" y="116" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">1</text><circle cx="173" cy="150" r="11" fill="#fffdfa" stroke="#192931" stroke-width="1.5"/><text x="173" y="154" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">2</text><circle cx="154" cy="224" r="11" fill="#fffdfa" stroke="#176d68" stroke-width="1.5"/><text x="154" y="228" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">3</text><circle cx="82" cy="224" r="11" fill="#fffdfa" stroke="#192931" stroke-width="1.5"/><text x="82" y="228" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">4</text><circle cx="63" cy="150" r="11" fill="#fffdfa" stroke="#192931" stroke-width="1.5"/><text x="63" y="154" font-size="11" fill="#192931" font-weight="700" text-anchor="middle">5</text><circle cx="118" cy="173" r="11" fill="#176d68" stroke="#176d68" stroke-width="1.5"/><text x="118" y="177" font-size="11" fill="#fffdfa" font-weight="700" text-anchor="middle">6</text><text x="217" y="144" font-size="17" fill="#176d68" font-weight="700" text-anchor="start">Join 1 and 3</text><text x="217" y="174" font-size="17" fill="#a54629" font-weight="700" text-anchor="start">Avoid 2 and 4</text><text x="217" y="213" font-size="17" fill="#192931" font-weight="600" text-anchor="start">Point 6 works.</text><text x="217" y="238" font-size="14" fill="#52636a" font-weight="600" text-anchor="start">1 and 3 aren’t linked.</text><rect x="425" y="110" width="122" height="35" rx="7" fill="#e7edf8" stroke="none" stroke-width="1"/><text x="486" y="132" font-size="14" fill="#245ca5" font-weight="700" text-anchor="middle">Request 1</text><line x1="552" y1="127" x2="592" y2="174" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="589.97463,163.90555 592,174 582.35924,170.38674" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="425" y="154" width="122" height="35" rx="7" fill="#e7edf8" stroke="none" stroke-width="1"/><text x="486" y="176" font-size="14" fill="#245ca5" font-weight="700" text-anchor="middle">Request 2</text><line x1="552" y1="171" x2="592" y2="174" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="583.39916,168.34089 592,174 582.65126,178.31289" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="425" y="198" width="122" height="35" rx="7" fill="#e7edf8" stroke="none" stroke-width="1"/><text x="486" y="220" font-size="14" fill="#245ca5" font-weight="700" text-anchor="middle">Request 3</text><line x1="552" y1="215" x2="592" y2="174" stroke="#52636a" stroke-width="2" stroke-linecap="round"/><polyline points="582.13618,176.95042 592,174 589.294,183.93366" stroke="#52636a" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="600" y="121" width="197" height="107" rx="10" fill="#e6efee" stroke="none" stroke-width="1"/><text x="698" y="151" font-size="15" fill="#176d68" font-weight="700" text-anchor="middle">ONE FIXED FINITE</text><text x="698" y="177" font-size="18" fill="#176d68" font-weight="700" text-anchor="middle">triangle-free graph</text><text x="698" y="201" font-size="11" fill="#52636a" font-weight="600" text-anchor="middle">All witnesses already inside</text></g><rect x="24" y="301" width="792" height="72" rx="12" fill="#192931" stroke="none" stroke-width="1"/><text x="48" y="324" font-size="12" fill="#d4ab92" font-weight="700" text-anchor="start">2026 WORKSHOP</text><text x="48" y="352" font-size="17" fill="#fffdfa" font-weight="700" text-anchor="start">No example even for 4 points</text><line x1="392" y1="336" x2="444" y2="336" stroke="#b1ccc7" stroke-width="2" stroke-linecap="round"/><polyline points="435,331 444,336 435,341" stroke="#b1ccc7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="472" y="324" font-size="12" fill="#b1ddcf" font-weight="700" text-anchor="start">FINITE GRAPH THEOREM</t