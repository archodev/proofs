<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Can a new point follow these connection rules?</title>
  <desc id="desc">A network of five numbered points, 1 to 5, arranged in a ring and joined by five existing links: 1 to 2, 2 to 3, 3 to 4, 4 to 5, and 5 to 1. A new point 6 sits in the middle. Exactly two new solid links are drawn, from 6 to 1 and from 6 to 3. Short dashed guide marks ending in an X point from 6 toward 2 and toward 4. They are labeled as not links, meaning 6 stays unlinked from 2 and 4. There is no line from 6 to 5. Because 1 and 3 are not linked to each other, the new links create no triangle. A card describes this example request: add point 6, link it to 1 and 3, do not link it to 2 or 4. A second card states the full result. For any size limit, there is a finite network with no triangles that meets every request up to that limit, as long as the points the new point must join are not linked to each other.</desc>

  <rect x="0" y="0" width="1200" height="820" fill="#faf7ef"/>

  <!-- Title -->
  <text x="600" y="54" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#1f2328">Can a new point follow these connection rules?</text>
  <text x="600" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#3a3f45">Dots are points, lines are links. A “triangle” means 3 points that are all linked to each other.</text>

  <!-- LEFT PANEL: the example picture -->
  <rect x="30" y="110" width="580" height="685" rx="18" fill="#ffffff" stroke="#2a8a86" stroke-width="3"/>
  <text x="54" y="146" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f6f6b">EXAMPLE: one request, drawn out</text>

  <!-- Existing ring links (5 edges) -->
  <g stroke="#2f3b4a" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="320" y1="270" x2="510.2" y2="408.2"/>
    <line x1="510.2" y1="408.2" x2="437.6" y2="631.8"/>
    <line x1="437.6" y1="631.8" x2="202.4" y2="631.8"/>
    <line x1="202.4" y1="631.8" x2="129.8" y2="408.2"/>
    <line x1="129.8" y1="408.2" x2="320" y2="270"/>
  </g>

  <!-- New solid links: 6-1 and 6-3 only -->
  <g stroke="#b5532a" stroke-width="7" stroke-linecap="round">
    <line x1="320" y1="470" x2="320" y2="270"/>
    <line x1="320" y1="470" x2="437.6" y2="631.8"/>
  </g>

  <!-- Dashed guide marks toward 2 and 4 (NOT links) -->
  <g stroke="#2a8a86" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round">
    <line x1="350.4" y1="460.1" x2="430.3" y2="434.1"/>
    <line x1="301.2" y1="495.9" x2="251.8" y2="563.8"/>
  </g>
  <g stroke="#2a8a86" stroke-width="5" stroke-linecap="round">
    <line x1="437" y1="420.5" x2="454" y2="437.5"/>
    <line x1="454" y1="420.5" x2="437" y2="437.5"/>
    <line x1="234" y1="568.5" x2="251" y2="585.5"/>
    <line x1="251" y1="568.5" x2="234" y2="585.5"/>
  </g>

  <!-- Direct labels on the lines -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">
    <text x="334" y="372" fill="#9a4321">new link</text>
    <text x="378" y="580" text-anchor="end" fill="#9a4321">new link</text>
    <text x="368" y="496" fill="#1f6f6b">not a link</text>
    <text x="268" y="524" text-anchor="end" fill="#1f6f6b">not a link</text>
  </g>

  <!-- Existing nodes 1-5 -->
  <g stroke="#2b5d9b" stroke-width="4" fill="#dce8f6">
    <circle cx="320" cy="270" r="28"/>
    <circle cx="510.2" cy="408.2" r="28"/>
    <circle cx="437.6" cy="631.8" r="28"/>
    <circle cx="202.4" cy="631.8" r="28"/>
    <circle cx="129.8" cy="408.2" r="28"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" text-anchor="middle">
    <text x="320" y="279">1</text>
    <text x="510.2" y="417.2">2</text>
    <text x="437.6" y="640.8">3</text>
    <text x="202.4" y="640.8">4</text>
    <text x="129.8" y="417.2">5</text>
  </g>

  <!-- New node 6 -->
  <circle cx="320" cy="470" r="30" fill="#f6dccd" stroke="#b5532a" stroke-width="5"/>
  <text x="320" y="479" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328">6</text>
  <text x="282" y="462" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#9a4321">new point</text>

  <!-- Legend -->
  <line x1="54" y1="700" x2="104" y2="700" stroke="#2f3b4a" stroke-width="5" stroke-linecap="round"/>
  <text x="114" y="707" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328">old link (5 of them)</text>
  <line x1="320" y1="700" x2="370" y2="700" stroke="#b5532a" stroke-width="7" stroke-linecap="round"/>
  <text x="380" y="707" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328">new link (only 2)</text>

  <line x1="54" y1="745" x2="90" y2="745" stroke="#2a8a86" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round"/>
  <line x1="94" y1="737" x2="108" y2="753" stroke="#2a8a86" stroke-width="5" stroke-linecap="round"/>
  <line x1="108" y1="737" x2="94" y2="753" stroke="#2a8a86" stroke-width="5" stroke-linecap="round"/>
  <text x="122" y="742" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1f6f6b">Dashed marks are NOT links:</text>
  <text x="122" y="770" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2328">6 must stay unlinked from 2 and from 4</text>

  <!-- RIGHT CARD 1: the example request -->
  <rect x="640" y="110" width="530" height="290" rx="18" fill="#ffffff" stroke="#2a8a86" stroke-width="3"/>
  <path d="M640 128 a18 18 0 0 1 18 -18 h494 a18 18 0 0 1 18 18 v32 h-530 z" fill="#2a8a86"/>
  <text x="664" y="146" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">THE EXAMPLE REQUEST</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1f2328">
    <circle cx="676" cy="198" r="14" fill="#2a8a86"/>
    <text x="676" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="702" y="206">Add a new point, <tspan font-weight="700">6</tspan>.</text>

    <circle cx="676" cy="243" r="14" fill="#2a8a86"/>
    <text x="676" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="702" y="251">Link it to <tspan font-weight="700" fill="#9a4321">1</tspan> and to <tspan font-weight="700" fill="#9a4321">3</tspan>.</text>

    <circle cx="676" cy="288" r="14" fill="#2a8a86"/>
    <text x="676" y="295" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="702" y="296">Do <tspan font-weight="700">not</tspan> link it to <tspan font-weight="700" fill="#1f6f6b">2</tspan> or to <tspan font-weight="700" fill="#1f6f6b">4</tspan>.</text>
  </g>
  <line x1="664" y1="318" x2="1146" y2="318" stroke="#e3ddcc" stroke-width="2"/>
  <path d="M664 348 l9 10 l18 -22" fill="none" stroke="#1f6f6b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="702" y="352" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f6f6b">Done, and still no triangle,</text>
  <text x="702" y="382" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">because 1 and 3 are not linked.</text>

  <!-- RIGHT CARD 2: the full result -->
  <rect x="640" y="420" width="530" height="375" rx="18" fill="#ffffff" stroke="#2b5d9b" stroke-width="3"/>
  <path d="M640 438 a18 18 0 0 1 18 -18 h494 a18 18 0 0 1 18 18 v32 h-530 z" fill="#2b5d9b"/>
  <text x="664" y="456" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">WHAT WAS PROVED</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1f2328">
    <text x="664" y="510">First, pick a size limit.</text>
    <text x="664" y="542">A finite network with no triangles</text>
    <text x="664" y="586">can be built to meet every</text>
    <text x="664" y="618">request up to that size: find a</text>
    <text x="664" y="650">new point linked to some of</text>
    <text x="664" y="682">the chosen points and not others.</text>
  </g>
  <rect x="656" y="702" width="498" height="76" rx="10" fill="#f6dccd"/>
  <text x="672" y="732" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#9a4321">Only condition: the points it must</text>
  <text x="672" y="762" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#9a4321">link to are not linked to each other.</text>
</svg>
