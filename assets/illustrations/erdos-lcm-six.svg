" stroke="none" stroke-width="1"/><circle cx="639" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="633.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="639" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">16</text><rect x="657" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="668" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="662.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="668" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">17</text><rect x="686" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="697" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="691.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="697" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">18</text><rect x="715" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="726" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="720.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="726" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">19</text><rect x="749.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="755" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">20</text><rect x="778.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="784" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">21</text><text x="575" y="225" font-size="15" fill="#52636a" font-weight="600" text-anchor="start">4 shared numbers</text><circle cx="35" cy="269" r="5" fill="#245ca5" stroke="none" stroke-width="1"/><text x="47" y="274" font-size="14" fill="#52636a" font-weight="500" text-anchor="start">first run</text><rect x="136" y="264" width="10" height="10" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="154" y="274" font-size="14" fill="#52636a" font-weight="500" text-anchor="start">second run</text><rect x="24" y="290" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="317" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">Two disjoint runs of six can never have equal LCMs.</text></g>
