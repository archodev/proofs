<svg xmlns="http://www.w3.org/2000/svg" width="840" height="345" viewBox="0 0 840 345" role="img" aria-labelledby="t d">
<title id="t">Equal LCM runs of six must overlap</title>
<desc id="d">Three previously known pairs of six consecutive integers share their least common multiple. Blue dots and rust squares mark the two runs. The shaded numbers are shared. The proof rules out any disjoint pair, including side-by-side runs.</desc>
<rect x="0" y="0" width="840" height="345" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#192931" font-weight="700" text-anchor="start">Same least common multiple? The runs overlap.</text><rect x="24" y="70" width="260" height="177" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="43" y="102" font-size="20" fill="#192931" font-weight="700" text-anchor="start">LCM 2,520</text><circle cx="49" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><text x="49" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">4</text><rect x="67" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="78" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="72.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="78" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">5</text><rect x="96" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="107" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="101.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="107" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">6</text><rect x="125" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="136" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="130.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="136" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">7</text><rect x="154" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="165" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="159.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="165" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">8</text><rect x="183" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="194" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="188.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="194" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">9</text><rect x="217.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="223" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">10</text><text x="43" y="225" font-size="15" fill="#52636a" font-weight="600" text-anchor="start">5 shared numbers</text><rect x="290" y="70" width="260" height="177" rx="14" fill="#fffdfa" stroke="#d8d4c9" stroke-width="1"/><text x="309" y="102" font-size="20" fill="#192931" font-weight="700" text-anchor="start">LCM 27,720</text><circle cx="315" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><text x="315" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">6</text><rect x="333" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="344" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="338.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="344" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">7</text><rect x="362" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke-width="1"/><circle cx="373" cy="136" r="6" fill="#245ca5" stroke="none" stroke-width="1"/><rect x="367.5" y="156" width="11" height="11" rx="2" fill="#a54629" stroke="none" stroke-width="1"/><text x="373" y="192" font-size="13" fill="#192931" font-weight="650" text-anchor="middle">8</text><rect x="391" y="119" width="22" height="79" rx="4" fill="#e6efee" stroke="none" stroke