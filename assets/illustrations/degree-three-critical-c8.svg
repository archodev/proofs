<svg xmlns="http://www.w3.org/2000/svg" width="840" height="337" viewBox="0 0 840 337" role="img" aria-labelledby="t d">
<title id="t">Why the last eight-vertex candidate fails</title>
<desc id="d">Six of its eight vertices induce K3,3: each of the three on the left connects to each of the three on the right, so every vertex in this proper subgraph has degree three. This rules out the final candidate for an eight-vertex degree-three-critical graph without an eight-cycle. The theorem covers all orders at least eight.</desc>
<rect x="0" y="0" width="840" height="337" rx="16" fill="#faf7f0" stroke="none" stroke-width="1"/>
<g font-family="Helvetica, Arial, sans-serif"><text x="30" y="44" font-size="28" fill="#192931" font-weight="700" text-anchor="start">Why the last eight-vertex candidate fails</text><rect x="207" y="76" width="244" height="197" rx="14" fill="#e6efee" stroke="none" stroke-width="1"/><line x1="86" y1="125" x2="86" y2="220" stroke="#a54629" stroke-width="2.5" stroke-linecap="round"/><line x1="86" y1="125" x2="237" y2="102" stroke="#a54629" stroke-width="2.5" stroke-linecap="round"/><line x1="86" y1="125" x2="237" y2="174" stroke="#a54629" stroke-width="2.5" stroke-linecap="round"/><line x1="86" y1="220" x2="237" y2="102" stroke="#a54629" stroke-width="2.5" stroke-linecap="round"/><line x1="86" y1="220" x2="237" y2="174" stroke="#a54629" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="102" x2="421" y2="102" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="102" x2="421" y2="174" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="102" x2="421" y2="246" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="174" x2="421" y2="102" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="174" x2="421" y2="174" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="174" x2="421" y2="246" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="246" x2="421" y2="102" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="246" x2="421" y2="174" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><line x1="237" y1="246" x2="421" y2="246" stroke="#176d68" stroke-width="2.5" stroke-linecap="round"/><rect x="76" y="115" width="20" height="20" rx="3" fill="#a54629" stroke="none" stroke-width="1"/><text x="86" y="130" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">x</text><rect x="76" y="210" width="20" height="20" rx="3" fill="#a54629" stroke="none" stroke-width="1"/><text x="86" y="225" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">y</text><circle cx="237" cy="102" r="12" fill="#176d68" stroke="none" stroke-width="1"/><text x="237" y="107" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">a</text><circle cx="237" cy="174" r="12" fill="#176d68" stroke="none" stroke-width="1"/><text x="237" y="179" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">b</text><circle cx="237" cy="246" r="12" fill="#176d68" stroke="none" stroke-width="1"/><text x="237" y="251" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">c</text><circle cx="421" cy="102" r="12" fill="#176d68" stroke="none" stroke-width="1"/><text x="421" y="107" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">p</text><circle cx="421" cy="174" r="12" fill="#176d68" stroke="none" stroke-width="1"/><text x="421" y="179" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">q</text><circle cx="421" cy="246" r="12" fill="#176d68" stroke="none" stroke-width="1"/><text x="421" y="251" font-size="14" fill="#fffdfa" font-weight="700" text-anchor="middle">r</text><text x="482" y="128" font-size="19" fill="#192931" font-weight="700" text-anchor="start">Look inside the shaded part.</text><text x="482" y="162" font-size="18" fill="#192931" font-weight="500" text-anchor="start">Each of these six points</text><text x="482" y="187" font-size="18" fill="#192931" font-weight="500" text-anchor="start">already has 3 neighbors there.</text><text x="482" y="230" font-size="18" fill="#176d68" font-weight="700" text-anchor="start">A smaller piece isn’t allowed to do that.</text><rect x="24" y="283" width="792" height="41" rx="9" fill="#e6efee" stroke="none" stroke-width="1"/><text x="420" y="310" font-size="19" fill="#176d68" font-weight="700" text-anchor="middle">Every degree-3-critical graph with 8+ vertices has an 8-cycle.</text></g>
</svg>
