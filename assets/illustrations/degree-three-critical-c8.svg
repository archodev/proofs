<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-labelledby="title desc">
  <title id="title">Why the last eight-vertex candidate is not degree-3-critical</title>
  <desc id="desc">An undirected graph G on eight vertices with fourteen edges. Square orange vertices x and y sit at left. Round dark teal vertices a, b, c form a center column and p, q, r form a right column. The nine teal edges join every vertex of a, b, c to every vertex of p, q, r. The five other edges are xy, xa, xb, ya and yb. A dashed rust outline marks the induced subgraph H on a, b, c, p, q, r, which is K3,3. Every vertex of H has degree 3, so H is a proper induced subgraph with minimum degree 3. Therefore G is not degree-3-critical and the candidate is excluded. Line crossings are not vertices.</desc>

  <rect x="0" y="0" width="820" height="310" fill="#FBF5EA"/>

  <!-- Induced K3,3 marker -->
  <rect x="198" y="30" width="226" height="260" rx="18" ry="18" fill="#B5482A" fill-opacity="0.06" stroke="#B5482A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="311" y="22" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B5482A" text-anchor="middle">H = induced K3,3</text>

  <!-- Five edges involving x and y -->
  <g stroke="#5E5248" stroke-width="2.2" stroke-linecap="round">
    <line x1="80" y1="110" x2="80" y2="200"/>
    <line x1="80" y1="110" x2="230" y2="72"/>
    <line x1="80" y1="110" x2="230" y2="150"/>
    <line x1="80" y1="200" x2="230" y2="72"/>
    <line x1="80" y1="200" x2="230" y2="150"/>
  </g>

  <!-- Nine teal edges of K3,3 -->
  <g stroke="#1F8A84" stroke-width="2.4" stroke-linecap="round">
    <line x1="230" y1="72" x2="390" y2="62"/>
    <line x1="230" y1="72" x2="390" y2="178"/>
    <line x1="230" y1="72" x2="390" y2="258"/>
    <line x1="230" y1="150" x2="390" y2="62"/>
    <line x1="230" y1="150" x2="390" y2="178"/>
    <line x1="230" y1="150" x2="390" y2="258"/>
    <line x1="230" y1="236" x2="390" y2="62"/>
    <line x1="230" y1="236" x2="390" y2="178"/>
    <line x1="230" y1="236" x2="390" y2="258"/>
  </g>

  <!-- Square orange vertices -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="65" y="95" width="30" height="30" rx="3" fill="#E07B2E" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="80" y="115" fill="#1A1A1A">x</text>
    <rect x="65" y="185" width="30" height="30" rx="3" fill="#E07B2E" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="80" y="205" fill="#1A1A1A">y</text>
  </g>

  <!-- Round teal vertices -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="230" cy="72" r="15" fill="#0F4F4F" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="230" y="77">a</text>
    <circle cx="230" cy="150" r="15" fill="#0F4F4F" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="230" y="155">b</text>
    <circle cx="230" cy="236" r="15" fill="#0F4F4F" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="230" y="241">c</text>
    <circle cx="390" cy="62" r="15" fill="#0F4F4F" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="390" y="67">p</text>
    <circle cx="390" cy="178" r="15" fill="#0F4F4F" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="390" y="183">q</text>
    <circle cx="390" cy="258" r="15" fill="#0F4F4F" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="390" y="263">r</text>
  </g>

  <!-- Explanation panel -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#1A1A1A">
    <text x="452" y="34" font-size="16" font-weight="700">Last 8-vertex candidate: excluded</text>
    <text x="452" y="58" font-size="13">14 edges: <tspan fill="#1F8A84" font-weight="700">9 teal</tspan> = all of {a,b,c}–{p,q,r}</text>
    <text x="452" y="76" font-size="13">plus xy, xa, xb, ya, yb</text>
    <text x="452" y="100" font-size="13">deg x = deg y = 3,  deg a = deg b = 5</text>
    <text x="452" y="118" font-size="13">deg c = deg p = deg q = deg r = 3</text>

    <rect x="446" y="134" width="356" height="86" rx="10" fill="#B5482A" fill-opacity="0.08" stroke="#B5482A" stroke-width="1.5"/>
    <text x="458" y="156" font-size="13" font-weight="700" fill="#B5482A">H = G − {x, y} is an induced K3,3</text>
    <text x="458" y="176" font-size="13">Each vertex of H has degree 3, so δ(H) = 3</text>
    <text x="458" y="196" font-size="13">H is a proper induced subgraph with δ ≥ 3</text>
    <text x="458" y="212" font-size="11" fill="#5E5248">(critical would need δ &lt; 3 for every one)</text>

    <text x="452" y="244" font-size="14" font-weight="700">So G is not degree-3-critical.</text>
    <text x="452" y="264" font-size="13">The candidate is ruled out.</text>
    <text x="452" y="290" font-size="11" fill="#5E5248">Line crossings are not vertices.</text>
  </g>
</svg>
