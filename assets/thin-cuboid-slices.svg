<title id="title">Survivor slices in the two checked thin cuboids</title>
<desc id="desc">Each grid is a fixed third-coordinate slice. Filled cells are zero labels, the surviving cubes: 17 in the 2 by 3 by 9 witness and 15 in the 3 by 3 by 6 witness. Rows and columns follow the first and second Lean coordinates.</desc>
