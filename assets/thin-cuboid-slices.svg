<text x="30" y="40" font-family="sans-serif" font-size="22" font-weight="700" fill="#172b49">Two checked terminal sets</text>
<text x="30" y="64" font-family="sans-serif" font-size="14" fill="#354d69">Filled = survivor · rows = first coordinate · columns = second coordinate · slices = third coordinate</text>

