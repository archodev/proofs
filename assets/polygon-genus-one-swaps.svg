<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Two genus-preserving chord swaps</title><desc id="desc">Three labelled hexagons show matchings 12 35 46, then 13 25 46, then 13 24 56. The first swap keeps chord 46; the second keeps chord 13. Each matching has two vertex cycles and genus one.</desc><rect width="960" height="350" rx="18" fill="#f4f7fb"/>
