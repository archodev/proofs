<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 245" width="450" height="245" role="img" aria-labelledby="title desc">
  <title id="title">Figure 1. The eight-vertex graph surviving the cycle and degree tests</title>
  <desc id="desc">The six circles induce K3,3 with parts a,b,c and p,q,r. The squares x and y are adjacent to one another and each is adjacent to a and b. Only marked points are vertices.</desc>
  <rect width="450" height="245" rx="8" fill="white"/>
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path stroke="#bb6519" d="M40 55 V160 M40 55 L168 42 M40 55 L168 125 M40 160 L168 42 M40 160 L168 125"/>
    <path stroke="#186476" d="M168 42 L385 31 M168 42 L385 118 M168 42 L385 210 M168 125 L385 31 M168 125 L385 118 M168 125 L385 210 M168 205 L385 31 M168 205 L385 118 M168 205 L385 210"/>
  </g>
  <g fill="#186476" stroke="white" stroke-width="1.6">
    <circle cx="168" cy="42" r="6"/><circle cx="168" cy="125" r="6"/><circle cx="168" cy="205" r="6"/>
    <circle cx="385" cy="31" r="6"/><circle cx="385" cy="118" r="6"/><circle cx="385" cy="210" r="6"/>
  </g>
  <g fill="#bb6519" stroke="white" stroke-width="1.6">
    <rect x="34" y="49" width="12" height="12"/><rect x="34" y="154" width="12" height="12"/>
  </g>
  <g fill="#202e35" font-family="serif" font-style="italic" font-size="20">
    <text x="18" y="58">x</text><text x="18" y="164">y</text>
    <text x="160" y="27">a</text><text x="166" y="148">b</text><text x="153" y="222">c</text>
    <text x="399" y="34">p</text><text x="399" y="121">q</text><text x="399" y="214">r</text>
  </g>
</svg>
